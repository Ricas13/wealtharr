# Oracle VM deployment: put HTTPS reverse proxy (Traefik/Caddy) in front of 127.0.0.1:3000.
# Use a private Docker network; PostgreSQL is never published on the VM.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strategyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: strategyos
    volumes:
      - strategyos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U strategyos -d strategyos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env.production]
    environment:
      # Supply a URL-encoded password in the private env file, avoiding malformed DSNs.
      DATABASE_URL: ${DATABASE_URL:?Configure the protected PostgreSQL URL with db hostname}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]
  scheduler:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
    command: ["/bin/sh","-ec","apk add --no-cache curl >/dev/null; while :; do curl --fail --silent --show-error --max-time 180 -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/actions || echo 'Cron cycle failed'; curl --silent --max-time 60 -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/health >/dev/null || true; sleep 3600; done"]
    networks: [internal]
  backup:
    profiles: [backups]
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env.production]
    environment:
      PGHOST: db
      PGUSER: strategyos
      PGDATABASE: strategyos
      PGPASSWORD: ${POSTGRES_PASSWORD:?Required}
      HEARTBEAT_URL: http://app:3000/api/cron/heartbeat
    volumes:
      - backup_status:/backup-status
    healthcheck:
      test: ["CMD-SHELL","test -r /backup-status/last-success && test $(($(date +%s)-$(cat /backup-status/last-success))) -lt 93600"]
      interval: 10m
      timeout: 10s
      retries: 2
    networks: [internal]
volumes:
  strategyos_db:
  backup_status:
networks:
  internal:
    driver: bridge
