# Oracle VM deployment: put HTTPS reverse proxy (Traefik/Caddy) in front of 127.0.0.1:3000.
# Use a private Docker network; PostgreSQL is never published on the VM.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strategyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: strategyos
    volumes:
      - strategyos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U strategyos -d strategyos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env.production]
    environment:
      # Supply a URL-encoded password in the private env file, avoiding malformed DSNs.
      DATABASE_URL: ${DATABASE_URL:?Configure the protected PostgreSQL URL with db hostname}
      # Bootstrap DB secrets must not reach the online app through env_file.
      POSTGRES_PASSWORD: ""
      APP_DB_PASSWORD: ""
      BACKUP_DB_PASSWORD: ""
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]
  maintenance:
    # Opt-in one-shot migrations/seed/role provisioning; never a long-running service.
    profiles: [maintenance]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://strategyos:${POSTGRES_PASSWORD:?Required}@db:5432/strategyos
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?Required}
    networks: [internal]
  scheduler:
    # BusyBox wget ships with Alpine, so nothing is downloaded when the container starts. It runs as an
    # unprivileged user with a read-only filesystem and receives only the cron credential.
    image: alpine:3.21
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
    command: ["/bin/sh","-ec","while :; do wget -q -T 180 -O /dev/null --header \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/actions || echo 'Cron cycle failed'; wget -q -T 60 -O /dev/null --header \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/health || true; sleep 3600; done"]
    networks: [internal]
  backup:
    profiles: [backups]
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Only what the backup needs: database access, the restic repository and its credentials, and the
    # cron secret for the heartbeat. Application secrets (AUTH_SECRET, APP_ENCRYPTION_KEY, billing keys)
    # are deliberately not passed. Put the repository's own credentials in .env.production under the
    # names listed here; add other backend variables here explicitly if your repository type needs them.
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      CRON_SECRET: ${CRON_SECRET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      PGHOST: db
      PGUSER: wealtharr_backup
      PGDATABASE: strategyos
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?Required}
      HEARTBEAT_URL: http://app:3000/api/cron/heartbeat
    volumes:
      - backup_status:/backup-status
    healthcheck:
      test: ["CMD-SHELL","test -r /backup-status/last-success && test $(($(date +%s)-$(cat /backup-status/last-success))) -lt 93600"]
      interval: 10m
      timeout: 10s
      retries: 2
    networks: [internal]
volumes:
  strategyos_db:
  backup_status:
networks:
  internal:
    driver: bridge
