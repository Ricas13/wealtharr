name: Inspect public 3Sig worksheet (research)

on:
  pull_request:
    paths:
      - ".github/workflows/3sig-public-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-primary-formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original author-public spreadsheet formula positions
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, tempfile, xml.etree.ElementTree as ET
          url="https://www.jasonkelly.com/worksheets/My%203%25%20Signal%20Plan.xlsx"
          with urllib.request.urlopen(url,timeout=20) as response:
              data=response.read()
          with tempfile.TemporaryFile() as target:
              target.write(data);target.seek(0)
              with zipfile.ZipFile(target) as archive:
                  ns={"x":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
                  for filename in [name for name in archive.namelist() if name.startswith("xl/worksheets/sheet") and name.endswith(".xml")][:1]:
                      root=ET.fromstring(archive.read(filename))
                      for row in root.findall(".//x:sheetData/x:row",ns):
                          i=int(row.get("r","0"))
                          if i not in (1,2,3,4,56):continue
                          print("ROW",i)
                          for cell in row.findall("x:c",ns):
                              addr=cell.get("r","")
                              form=cell.find("x:f",ns)
                              val=cell.find("x:v",ns)
                              if form is not None or i in (1,2,56):
                                  print(addr,"FORMULA",(form.text if form is not None else "") or "", "cached", val.text if val is not None else "")
          PY
