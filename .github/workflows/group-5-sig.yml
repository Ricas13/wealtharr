name: Group 5 Sig validation

on:
  pull_request:
    paths:
      - "src/domain/strategy/sig-*.ts"
      - "src/domain/strategy/9sig-community-rules.ts"
      - "src/domain/strategy/quarterly-signal-engine.ts"
      - "src/domain/strategy/sig-confirmed-ledger.ts"
      - "src/domain/strategy/types.ts"
      - "src/lib/action-service.ts"
      - "src/domain/strategy/registry.ts"
      - "tests/sig-*.test.ts"
      - "tests/9sig-community-rules.test.ts"
      - "tests/quarterly-signal-engine.test.ts"
      - "tests/quarterly-target-golden.test.ts"
      - "tests/sig-confirmed-ledger.test.ts"
      - "docs/strategy-specs/9sig.md"
      - "docs/strategy-specs/quarterly-target-*.md"
      - "src/domain/strategy/catalog/quarterly-target-*.ts"
      - "src/domain/strategy/sig-owner-conventions.ts"
      - "tests/sig-owner-conventions.test.ts"
      - ".github/workflows/group-5-sig.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Group 5 scope lint
        run: npx eslint src/domain/strategy/sig-nyse-quarters.ts tests/sig-nyse-quarters.test.ts src/domain/strategy/sig-confirmed-ledger.ts tests/sig-confirmed-ledger.test.ts src/domain/strategy/sig-quarter-closes.ts tests/sig-quarter-closes.test.ts src/domain/strategy/quarterly-signal-engine.ts tests/quarterly-signal-engine.test.ts tests/quarterly-target-golden.test.ts src/domain/strategy/registry.ts src/domain/strategy/9sig-community-rules.ts tests/9sig-community-rules.test.ts src/domain/strategy/sig-owner-conventions.ts tests/sig-owner-conventions.test.ts
      - name: TypeScript
        run: npm run typecheck
      - name: Source-confirmed arithmetic tests
        run: npx vitest run tests/quarterly-target-golden.test.ts tests/quarterly-signal-engine.test.ts tests/sig-nyse-quarters.test.ts tests/9sig-community-rules.test.ts tests/sig-owner-conventions.test.ts tests/sig-confirmed-ledger.test.ts tests/sig-quarter-closes.test.ts
