name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Mirror of the official Postgres image. Avoid Docker Hub unauthenticated rate limits
        # on ephemeral GitHub runners (toomanyrequests before tests even start).
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: strategyos
          POSTGRES_PASSWORD: strategyos
          POSTGRES_DB: strategyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strategyos -d strategyos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://strategyos:strategyos@127.0.0.1:5432/strategyos_test
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      CRON_SECRET: ci-only-cron-secret-long-enough
      EMAIL_PROVIDER: mock
      MARKET_DATA_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Migration validation
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - name: Validate Oracle Compose and offsite backup image
        run: |
          printf 'POSTGRES_PASSWORD=ci-db-pass\nDATABASE_URL=postgresql://strategyos:ci-db-pass@db:5432/strategyos\n' > .env.production
          docker compose --profile backups -f docker-compose.oracle.yml --env-file .env.production config --quiet
          docker compose -f docker-compose.oracle.yml -f docker-compose.traefik.yml --env-file .env.production config --format json > /tmp/wealtharr-traefik-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/wealtharr-traefik-compose.json') as file:
              config = json.load(file)
          app = config['services']['app']
          assert not app.get('ports'), 'Wealtharr must not publish a host port behind Traefik'
          assert 'media_net' in app['networks'], 'Wealtharr must join the shared proxy network'
          assert 'internal' in app['networks'], 'Wealtharr must retain the private database network'
          assert config['networks']['media_net']['external'] is True
          assert config['services']['db'].get('ports') in (None, []), 'Database must remain private'
          assert app['labels']['traefik.http.routers.wealtharr.rule'] == 'Host(`wealtharr.vpn4u.cc`)'
          scheduler = config['services']['scheduler']
          assert set(scheduler.get('environment', {})) == {'CRON_SECRET'}
          assert not scheduler.get('env_file')
          PY
          docker build --quiet -f docker/backup.Dockerfile .
          rm -f .env.production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build production application image and verify runtime boundary
        run: |
          docker build --tag wealtharr-ci:${{ github.sha }} .
          test "$(docker inspect --format '{{.Config.User}}' wealtharr-ci:${{ github.sha }})" = node
          docker run --rm --entrypoint node wealtharr-ci:${{ github.sha }} -e "for (const p of ['next','tsx','postgres']) require.resolve(p); for (const p of ['vitest','eslint','drizzle-kit']) { try { require.resolve(p); process.exit(1); } catch (e) { if (e.code !== 'MODULE_NOT_FOUND') throw e; } }"
      - name: Smoke-test production runtime and migration tooling
        run: |
          docker run --rm --network host --env DATABASE_URL wealtharr-ci:${{ github.sha }} npm run db:migrate
          docker run --detach --name wealtharr-runtime-smoke --network host \
            --env DATABASE_URL --env AUTH_SECRET --env AUTH_TRUST_HOST \
            --env APP_ENCRYPTION_KEY --env CRON_SECRET --env NEXT_PUBLIC_APP_URL \
            --env EMAIL_PROVIDER --env MARKET_DATA_PROVIDER wealtharr-ci:${{ github.sha }}
          trap 'docker logs wealtharr-runtime-smoke; docker rm -f wealtharr-runtime-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install browser for responsive smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wealtharr-browser-regressions
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
